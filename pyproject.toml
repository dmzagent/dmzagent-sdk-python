[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "concordex"
version = "0.6.0"
description = "The codex of trust between minds — Python SDK for emitting agent events to Anima and governing them through Concordia's MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Concordex", email = "sdk@concordex.dev" },
]
keywords = ["ai", "agents", "observability", "governance", "circuit-breaker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage      = "https://concordex.dev"
Documentation = "https://docs.concordex.dev/sdk/python"
Source        = "https://github.com/praeceptor-thesis/concordex-sdk-python"
Issues        = "https://github.com/praeceptor-thesis/concordex-sdk-python/issues"
Spec          = "https://github.com/praeceptor-thesis/concordex-sdk-spec"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "mypy>=1.5",
    "ruff>=0.5",
]

[tool.concordex]
# Spec version this SDK implements. CI verifies the checked-out
# concordex-sdk-spec tag matches this value. See sdk-spec.md §11.1.
spec-version = "0.5.0"

[tool.hatch.build.targets.wheel]
packages = ["concordex"]

[tool.hatch.build.targets.sdist]
include = ["concordex/**", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version    = "3.10"
strict            = true
warn_return_any   = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
