name: Spec Conformance

# Runs the contract test corpus from concordex-sdk-spec against this
# SDK build. Reports the status check `spec-conformance/<version>` that
# the spec repo's promote.yml verifies before dispatching publish.yml
# here.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: spec-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      - name: Resolve pinned spec version
        id: spec
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['concordex']['spec-version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve spec checkout ref
        id: spec_ref
        env:
          VERSION: ${{ steps.spec.outputs.version }}
        run: |
          # Release branches/tags gate against the immutable spec tag.
          # Dev work on main follows the spec repo's main branch so day-1
          # commits don't fail against a tag that hasn't been cut yet.
          case "$GITHUB_REF" in
            refs/heads/release/*|refs/tags/v*)
              echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"
              echo "mode=release"  >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ref=main"      >> "$GITHUB_OUTPUT"
              echo "mode=dev"      >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out concordex-sdk-spec
        uses: actions/checkout@v4
        with:
          repository: praeceptor-thesis/concordex-sdk-spec
          ref: ${{ steps.spec_ref.outputs.ref }}
          path: spec

      - name: Verify spec VERSION matches pin (release mode only)
        if: steps.spec_ref.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.spec.outputs.version }}
        run: |
          FILE_VERSION=$(cat spec/VERSION | tr -d '[:space:]')
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::spec VERSION '$FILE_VERSION' does not match pin '$VERSION'"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install SDK + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run contract tests
        env:
          CONCORDEX_SPEC_PATH: ${{ github.workspace }}/spec
        run: pytest tests/test_contract.py -v

      - name: Report status check
        if: matrix.python == '3.12' && always()
        uses: actions/github-script@v7
        env:
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          SPEC_VERSION: ${{ steps.spec.outputs.version }}
        with:
          script: |
            const { CONCLUSION, SPEC_VERSION } = process.env;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   context.sha,
              state: CONCLUSION,
              context: `spec-conformance/${SPEC_VERSION}`,
              description: CONCLUSION === 'success'
                ? `Contract corpus passed against spec v${SPEC_VERSION}`
                : `Contract corpus failed against spec v${SPEC_VERSION}`,
            });
