name: Spec Conformance

# Runs the contract test corpus from concordex-sdk-spec against this
# SDK build. Reports the status check `spec-conformance/<version>` that
# the spec repo's promote.yml verifies before dispatching publish.yml
# here.

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      - name: Resolve pinned spec version
        id: spec
        run: |
          VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['tool']['concordex']['spec-version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out concordex-sdk-spec at pinned tag
        uses: actions/checkout@v4
        with:
          repository: praeceptor-thesis/concordex-sdk-spec
          ref: v${{ steps.spec.outputs.version }}
          path: spec

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install SDK + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run contract tests
        env:
          CONCORDEX_SPEC_PATH: ${{ github.workspace }}/spec
        run: pytest tests/test_contract.py -v

      - name: Report status check
        if: matrix.python == '3.12' && always()
        uses: actions/github-script@v7
        env:
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          SPEC_VERSION: ${{ steps.spec.outputs.version }}
        with:
          script: |
            const { CONCLUSION, SPEC_VERSION } = process.env;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   context.sha,
              state: CONCLUSION,
              context: `spec-conformance/${SPEC_VERSION}`,
              description: CONCLUSION === 'success'
                ? `Contract corpus passed against spec v${SPEC_VERSION}`
                : `Contract corpus failed against spec v${SPEC_VERSION}`,
            });
